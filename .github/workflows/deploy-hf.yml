
name: Deploy EvalDesk to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Push dist to Hugging Face Space
        run: |
          cd dist
          if [ ! -f README.md ]; then
            printf -- "---\ntitle: EvalDesk\nemoji: 📝\ncolorFrom: green\ncolorTo: gray\nsdk: static\npinned: false\n---\n" > README.md
          fi
          git init
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Deploy EvalDesk static build"
          git push --force "https://user:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/${{ vars.HF_SPACE }}" HEAD:main
