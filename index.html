<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EvalDesk — AI Answer Sheet Evaluation System</title>
    <meta
      name="description"
      content="Local-first AI-assisted handwritten answer sheet evaluation, rubric grading, and academic result publishing workspace."
    />
    <meta property="og:title" content="EvalDesk — AI Answer Sheet Evaluation System" />
    <meta
      property="og:description"
      content="Local-first AI-assisted handwritten answer sheet evaluation, rubric grading, and academic result publishing workspace."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('evaldesk_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F6F7F5] dark:bg-[#111312] text-[#111827] dark:text-[#ECEEED] antialiased selection:bg-[#E8F3EE] selection:text-[#0F5132] dark:selection:bg-[#1A2B23] dark:selection:text-[#7CC9A3]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
